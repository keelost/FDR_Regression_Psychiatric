  - defaults
dependencies:
  # --- Core ---
  - python>=3.9,<3.12
  - r-base>=4.2
  # --- Python ---
  - pandas>=1.4
  - numpy>=1.22
  - scipy>=1.8
  - requests>=2.28

  # --- R (base + CRAN) ---
  - r-optparse>=1.7
  - r-data.table>=1.14
  - r-dplyr>=1.0
  - r-stringr>=1.4
  - r-glmnet>=4.1
  - r-ggplot2>=3.4
  - r-readr
  - r-scales
  - r-foreach>=1.5
  - r-doparallel>=1.0
  # --- Bioinformatics tools available from bioconda ---
  - plink2>=2.0
